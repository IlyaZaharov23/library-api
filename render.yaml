services:
  - type: web
    name: library-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elistardj
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: elistardj
    plan: free
